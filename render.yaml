databases:
  - name: papelyluna-db
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
    databaseName: papelyluna
    user: papelyluna

services:
  - type: web
    name: papelyluna-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn papelyluna.wsgi:application --bind 0.0.0.0:$PORT --access-logfile - --error-logfile -
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: papelyluna-db
          property: connectionString
      - key: CORS_ORIGENES
        sync: false